name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CI does not install libBGPStream / pybgpstream. The BGP ingest path
      # is in the optional `[bgp]` extra; unit tests and lint do not exercise
      # it. Wiring up libBGPStream in CI is open work — see BENCHMARK.md.

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src/netpulse

      - name: Test (pytest, unit tests only)
        run: uv run pytest -q
