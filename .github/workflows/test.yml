name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libBGPStream is a C library that pybgpstream binds to. CAIDA publishes
      # apt packages; if the install step below stops working, see
      # https://bgpstream.caida.org/docs/install for the current instructions.
      - name: Install libBGPStream
        run: |
          set -e
          curl -fsSL https://pkg.caida.org/os/ubuntu/keyring.gpg \
              | sudo tee /etc/apt/trusted.gpg.d/caida.gpg > /dev/null
          codename=$(lsb_release -sc)
          echo "deb https://pkg.caida.org/os/ubuntu ${codename} main" \
              | sudo tee /etc/apt/sources.list.d/caida.list
          sudo apt-get update
          sudo apt-get install -y libbgpstream2-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src/netpulse

      - name: Test (pytest, unit tests only)
        run: uv run pytest -q
