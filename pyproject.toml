[project]
name = "netpulse"
version = "0.0.1"
description = "Multi-signal Internet outage and BGP anomaly detector with a public, reproducible benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NetPulse contributors" }]
keywords = ["bgp", "internet-measurement", "outage-detection", "ripe-atlas", "anomaly-detection"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "duckdb>=1.0.0",
    "ripe.atlas.cousteau>=1.5",
    "ripe.atlas.sagan>=1.3",
    "dnspython>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Requires the libBGPStream native library (macOS: 'brew install bgpstream';
# Linux: see https://bgpstream.caida.org/docs/install). Kept out of the core
# dependency set so CI and contributors who do not need BGP ingest can
# `uv sync` cleanly.
bgp = ["pybgpstream>=2.0.0"]

# Charts and figures generated under docs/img/. Pure-Python install, kept
# optional so the core install stays small.
viz = ["matplotlib>=3.8"]

[project.scripts]
netpulse = "netpulse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netpulse"]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",  # required by fastapi.testclient
]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/netpulse"]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pybgpstream", "pybgpstream.*", "ripe.*", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires network and external services (deselected by default)",
]
asyncio_mode = "auto"
