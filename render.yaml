# Render Blueprint -- one-click free-tier deploy for NetPulse.
#
# To deploy:
#   1. Push this file (already on main).
#   2. Open https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" -> connect github.com/pauti04/netpulse
#   4. Render reads this file, builds the Dockerfile, and exposes the
#      FastAPI surface on a free .onrender.com subdomain in ~3 minutes.
#
# Free-tier caveats: the service spins down after 15 minutes of idle and
# takes ~30 seconds to cold-start. /health and /ready respond after warmup.

services:
  - type: web
    name: netpulse
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render assigns the port via $PORT; we override the Dockerfile CMD
    # so `netpulse serve` listens on it instead of the baked-in 8000.
    dockerCommand: >
      netpulse serve
      --store /app/data/fixtures/youtube_2008_demo.duckdb
      --baseline /app/data/baselines/yt_rib_filtered.duckdb
      --history /tmp/alerts.duckdb
      --host 0.0.0.0
      --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
